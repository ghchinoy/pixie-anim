[package]
name = "pixie-anim"
version = "0.1.0"
edition = "2021"
description = "A zero-dependency, SIMD-accelerated animation optimizer"
license = "MIT"
default-run = "pixie-anim"

[lib]
name = "pixie_anim_lib"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pixie-anim"
path = "src/bin/pixo-gif.rs"
required-features = ["cli"]

[[bin]]
name = "judge"
path = "src/bin/judge.rs"
required-features = ["cli"]

[features]
default = ["simd"]
simd = []
wasm = ["wasm-bindgen", "talc", "rayon", "image"]
cli = ["clap", "image", "gemini-client-api", "serde_json", "tokio", "futures", "mime", "dotenvy", "rayon"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
talc = { version = "4", optional = true, default-features = false, features = ["lock_api"] }
clap = { version = "4.5", features = ["derive"], optional = true }
image = { version = "0.24", optional = true }
rayon = { version = "1.10", optional = true }
gemini-client-api = { version = "5.6.2", optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }
mime = { version = "0.3", optional = true }
dotenvy = { version = "0.15", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
panic = "unwind"
lto = false
opt-level = 3

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "components"
harness = false
